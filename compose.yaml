services:
  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: modernewolke/oxygen-license-server:latest
    container_name: oxygen-license-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/data
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-geheimes-admin-passwort-aendern}
      - SIGNING_SECRET=${SIGNING_SECRET:-modernewolke-oxygen-license-secret-key-32b}
      - CORS_ORIGINS=*
    volumes:
      - license_data:/data

volumes:
  license_data:
    name: oxygen_license_data
