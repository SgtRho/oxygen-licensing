services:
  license-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: modernewolke/oxygen-license-server:latest
    container_name: oxygen-license-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DATA_DIR=/data
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@modernewolke.de}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-modernewolke2026!}
      - RESET_ADMIN_TOTP=${RESET_ADMIN_TOTP:-false}
      - SIGNING_SECRET=${SIGNING_SECRET:-modernewolke-oxygen-license-secret-key-32b}
      - SESSION_EXPIRE_HOURS=${SESSION_EXPIRE_HOURS:-48}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    volumes:
      - license_data:/data

volumes:
  license_data:
    name: oxygen_license_data
